; PlatformIO Project Configuration File
;
; ESP32 "Muscles" firmware for the robot.
; Offline-friendly: builds locally, no runtime internet dependency.
;
; Notes:
; - Select the exact ESP32 board you have (see `board = ...` below).
; - Default serial speed is 115200 to match the Pi-side comms.
; - If you use an ESP32 variant (S3/C3/etc), change the environment accordingly.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor for debugging + JSON Lines protocol I/O
monitor_speed = 115200
monitor_filters =
  time

; Build flags
build_flags =
  -D ROBOT_FW_VERSION=\"0.1.0\"
  -D CORE_DEBUG_LEVEL=0
  ; Increase if you want verbose logs:
  ; -D CORE_DEBUG_LEVEL=3

; Libraries (keep minimal; add as you need)
; ArduinoJson is commonly used for JSON parsing on ESP32.
lib_deps =
  bblanchon/ArduinoJson@^7.0.4

; Upload settings (usually auto-detected; override if needed)
; upload_port = COM3
; monitor_port = COM3

; If you plan to use WiFi later, Arduino framework already includes it.
; For motor control / servo control, add libraries only after you choose hardware.
